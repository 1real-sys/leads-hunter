<div class="mapa-busca">
  <div
    #mapContainer
    class="mapa-busca__canvas"
    role="region"
    aria-label="Mapa interativo para selecionar o centro e visualizar o raio da busca"
    aria-describedby="mapa-instrucoes"
  ></div>
  <div class="mapa-busca__instructions">
    <p id="mapa-instrucoes">
      Use os controles para aplicar zoom. Clique no mapa ou arraste o marcador para mudar o centro.
    </p>
    <button type="button" (click)="useVisibleCenter()">Usar centro visível</button>
  </div>
</div>
