<p id="kanban-scroll-hint" class="kanban-board__hint">
  Arraste pelo controle do card ou use os botões de etapa. Role horizontalmente para comparar o
  funil.
</p>

<div
  class="kanban-board__viewport"
  role="region"
  aria-label="Quadro Kanban por etapa comercial"
  aria-describedby="kanban-scroll-hint"
  tabindex="0"
>
  <div cdkDropListGroup class="kanban-board">
    @for (coluna of agrupamento().colunas; track coluna.status) {
      <app-kanban-column
        [coluna]="coluna"
        [idsEmMovimento]="idsEmMovimento()"
        [bloqueado]="bloqueado()"
        (mudancaStatusSolicitada)="mudancaStatusSolicitada.emit($event)"
        (detalheSolicitado)="detalheSolicitado.emit($event)"
      />
    }
    @if (agrupamento().semEtapa; as semEtapa) {
      <app-kanban-column
        [coluna]="semEtapa"
        [idsEmMovimento]="idsEmMovimento()"
        [bloqueado]="bloqueado()"
        (mudancaStatusSolicitada)="mudancaStatusSolicitada.emit($event)"
        (detalheSolicitado)="detalheSolicitado.emit($event)"
      />
    }
  </div>
</div>
