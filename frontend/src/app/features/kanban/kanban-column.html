@if (coluna(); as colunaAtual) {
  <section
    class="kanban-column"
    [attr.aria-labelledby]="tituloId()"
    [attr.data-status]="colunaAtual.status ?? 'SEM_ETAPA'"
  >
    <header class="kanban-column__header">
      <h2 [id]="tituloId()">{{ colunaAtual.rotulo }}</h2>
      <span [attr.aria-label]="colunaAtual.leads.length + ' leads nesta etapa'">
        {{ colunaAtual.leads.length }}
      </span>
    </header>

    <ul
      cdkDropList
      class="kanban-column__leads"
      [cdkDropListData]="colunaAtual"
      [cdkDropListDisabled]="bloqueado()"
      [cdkDropListEnterPredicate]="aceitaDestino"
      [cdkDropListSortingDisabled]="true"
      (cdkDropListDropped)="soltar($event)"
    >
      @for (lead of colunaAtual.leads; track lead.id) {
        <li
          cdkDrag
          class="kanban-column__lead"
          [cdkDragData]="lead"
          [cdkDragDisabled]="interacaoDesabilitada(lead.id)"
        >
          <app-lead-card
            [lead]="lead"
            [movendo]="emMovimento(lead.id)"
            [interacaoDesabilitada]="interacaoDesabilitada(lead.id)"
            (mudancaStatusSolicitada)="solicitarMudanca(lead, $event)"
          />
        </li>
      } @empty {
        <li class="kanban-column__empty">Nenhum lead nesta etapa.</li>
      }
    </ul>
  </section>
}
