spring:
  application:
    name: leads-hunter
  datasource:
    url: jdbc:mysql://localhost:3306/leadsradar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    nearby-search-url: https://places.googleapis.com/v1/places:searchNearby
